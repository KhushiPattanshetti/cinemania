<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horror Movies</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            overflow-x: hidden;
            background: black;
        }
        .background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('{% static "romancebg.png" %}') no-repeat center center fixed;
            background-size: cover;
            z-index: -1; /* Ensure the background is behind all content */
        }
        .navbar {
            position: fixed;
            top: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.2); /* Semi-transparent black background */
            backdrop-filter: blur(10px); /* Glassmorphism effect */
            -webkit-backdrop-filter: blur(10px); /* For Safari support */
            padding: 10px 20px;
            box-sizing: border-box;
            z-index: 1; /* Ensures the navbar is on top */
        }
        .navbar a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
            font-size: 1em;
        }
        .navbar img {
            height: 80px;
        }
        .dropdown {
            position: relative;
            display: inline-block;
        }
        .dropdown-content {
            display: none;
            position: absolute;
            background-color: rgba(0, 0, 0, 0.8);
            min-width: 160px;
            box-shadow: 0px 8px 16px 0px rgba(0, 0, 0, 0.2);
            z-index: 2; /* Ensure dropdown is above other content */
        }
        .dropdown-content a {
            color: white;
            padding: 12px 16px;
            text-decoration: none;
            display: block;
        }
        .dropdown-content a:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }
        .dropbtn:hover + .dropdown-content, .dropdown-content:hover {
            display: block;
        }
        .content {
            margin-top: 100px; /* Add margin to avoid navbar overlap */
        }
        .content h1 {
            text-align: center;
            color: white;
        }
        .movies {
            display: grid;
            grid-template-columns: repeat(4, 1fr); /* Four columns */
            gap: 20px; /* Space between items */
            margin-top: 20px;
            margin-left: 20px;
            margin-right: 20px;
        }
        .movie {
            position: relative;
            width: 100%; /* Full width within the grid column */
            text-align: center;
            cursor: pointer;
            overflow: hidden; /* Ensures the hover effect does not overflow the container */
        }
        .movie img {
            width: 100%;
            height: 200px; /* Set a fixed height */
            object-fit: cover;
            transition: transform 0.3s ease-in-out; /* Smooth transition effect */
        }
        .movie:hover img {
            transform: scale(1.1); /* Zoom effect on hover */
        }
        .movie-title {
            margin-top: 10px;
            font-size: 20px;
            color: azure;
        }
    </style>
</head>
<body>

<div class="background"></div>

<div class="navbar">
    <img src="{% static 'logo.png' %}" alt="Logo">
    <div>
        <a href="first.html">Home</a>
        <a href="#about">About</a>
        <a href="#services">Services</a>
        <a href="#contact">Contact</a>
        <div class="dropdown">
            <div class="dropdown">
                <a href="#" class="dropbtn">Genres</a>
                <div class="dropdown-content">
                    <a href="{% url 'comedy' %}">Comedy</a>
            <a href="{% url 'action' %}">Action</a>
            <a href="{% url 'teen' %}">Teen</a>
            <a href="{% url 'east_asian' %}">East Asian</a>
            <a href="{% url 'romance' %}">Romance</a>
            <a href="{% url 'horror' %}">Horror</a>
            <a href="{% url 'family' %}">Family</a>
        </div>
        </div>
    </div>
</div>

<div class="content">
    <h1>Top Horror Movies</h1>
    <div class="movies">
        <div class="movie" onclick="window.location.href='https://www.imdb.com/title/tt7784604/?ref_=nv_sr_srsg_0_tt_4_nm_4_in_0_q_heredi'">
            <img src="{% static 'th.jpeg' %}" alt="Hereditary">
            <div class="movie-title">Hereditary</div>
        </div>
        <div class="movie" onclick="window.location.href='https://www.imdb.com/title/tt13345606/'">
            <img src="{% static 'edr.jpeg' %}" alt="Evil Dead Rise">
            <div class="movie-title">Evil Dead Rise</div>
        </div>
        <div class="movie" onclick="window.location.href='https://www.imdb.com/title/tt15474916/'">
            <img src="{% static 'smile.jpeg' %}" alt="Smile">
            <div class="movie-title">Smile</div>
        </div>
        <div class="movie" onclick="window.location.href='https://www.imdb.com/title/tt8155288/'">
            <img src="{% static 'hdd.webp' %}" alt="Happy Death Day">
            <div class="movie-title">Happy Death Day</div>
        </div>
        <div class="movie" onclick="window.location.href='https://www.imdb.com/title/tt1148204/'">
            <img src="{% static 'orp.jpeg' %}" alt="Orphan">
            <div class="movie-title">Orphan</div>
        </div>
        <div class="movie" onclick="window.location.href='https://www.imdb.com/title/tt0281358/'">
            <img src="{% static 'te.avif' %}" alt="The Exorcist">
            <div class="movie-title">The Exorcist</div>
        </div>
        <div class="movie" onclick="window.location.href='https://www.imdb.com/title/tt7550014/'">
            <img src="{% static 'ne.jpg' %}" alt="No Exit">
            <div class="movie-title">No Exit</div>
        </div>
        <div class="movie" onclick="window.location.href='https://www.imdb.com/title/tt7711170/'">
            <img src="{% static 'alone.jpeg' %}" alt="Alone">
            <div class="movie-title">Alone</div>
        </div>
        <div class="movie" onclick="window.location.href='https://www.imdb.com/title/tt10638522/'">
            <img src="{% static 'ttm.jpeg' %}" alt="Talk To Me">
            <div class="movie-title">Talk To Me</div>
        </div>
        <div class="movie" onclick="window.location.href='https://www.imdb.com/title/tt1396484/'">
            <img src="{% static 'it.jpeg' %}" alt="It">
            <div class="movie-title">It</div>
        </div>
        <div class="movie" onclick="window.location.href='https://www.imdb.com/title/tt3322940/'">
            <img src="{% static 'ana.jpeg' %}" alt="Anabelle">
            <div class="movie-title">Anabelle</div>
        </div>
        <div class="movie" onclick="window.location.href='https://m.imdb.com/title/tt3065204/mediaviewer/rm1168776704/'">
            <img src="{% static 'tc.webp' %}" alt="The Conjuring">
            <div class="movie-title">The Conjuring</div>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', (event) => {
        // Close the dropdown if the user clicks outside of it
        window.onclick = function(event) {
            if (!event.target.matches('.dropbtn')) {
                const dropdowns = document.getElementsByClassName("dropdown-content");
                for (let i = 0; i < dropdowns.length; i++) {
                    const openDropdown = dropdowns[i];
                    if (openDropdown.style.display === 'block') {
                        openDropdown.style.display = 'none';
                    }
                }
            }
        };
    });
</script>
